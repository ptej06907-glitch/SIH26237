services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    networks: [offline]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [api]
    networks: [offline]
networks:
  offline:
    internal: true
